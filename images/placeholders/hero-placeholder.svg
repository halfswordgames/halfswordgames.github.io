<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Placeholder for hero background">
  <!-- STUDIO: this is a labeled placeholder, not real artwork. Replace by dropping
       images/video/hero-loop.mp4 (+ .webm) and images/hero.jpg / hero.webp into the repo.
       See index.html hero section for exact filenames. -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#2a2523" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1e1917"/>
      <stop offset="1" stop-color="#0a0908"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#vig)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <line x1="0" y1="360" x2="1920" y2="360" stroke="#a3141d" stroke-width="2" opacity=".6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#9a948a" text-anchor="middle">
    <text x="960" y="200" font-size="44" fill="#e9e2d3">HERO BACKGROUND PLACEHOLDER</text>
    <text x="960" y="270" font-size="26">Drop in: images/video/hero-loop.mp4 + hero-loop.webm (muted loop, 1920×1080)</text>
    <text x="960" y="315" font-size="26">Fallback still: images/hero.jpg + images/hero.webp (1920×1080)</text>
  </g>
</svg>
